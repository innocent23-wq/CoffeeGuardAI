<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoffeeGuard - Forgot Password</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #6E1E3A 0%, #8C2A4C 30%, #C22C5D 70%, #E23F73 100%);
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 80%;
            height: 200%;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.05) 0%, transparent 70%);
            transform: rotate(-15deg);
            pointer-events: none;
        }

        .recover-box {
            position: relative;
            z-index: 1;
            background: white;
            padding: 40px 44px;
            border-radius: 24px;
            width: 420px;
            max-width: 92%;
            box-shadow: 0 30px 60px rgba(60, 10, 10, 0.35);
            text-align: center;
            max-height: 95vh;
            overflow-y: auto;
        }

        .recover-box::-webkit-scrollbar {
            width: 4px;
        }

        .recover-box::-webkit-scrollbar-thumb {
            background: #E23F73;
            border-radius: 10px;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1.3rem;
            font-weight: 700;
            color: #E23F73;
            margin-bottom: 6px;
        }

        .recover-box h2 {
            font-size: 1.8rem;
            color: #2B2430;
            margin-bottom: 4px;
        }

        .subtitle {
            color: #8D8494;
            font-size: 0.95rem;
            margin-bottom: 28px;
        }

        .field {
            position: relative;
            margin: 12px 0;
        }

        .field .icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: #8D8494;
        }

        .field input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            border: 2px solid #EFDDE4;
            border-radius: 12px;
            outline: none;
            font-size: 0.95rem;
            background: #FEFAFB;
            transition: 0.25s ease;
        }

        .field input:focus {
            border-color: #E23F73;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(226, 63, 115, 0.08);
        }

        .field input::placeholder {
            color: #B8A8B0;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: #E23F73;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            transition: 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
        }

        .btn-primary:hover {
            background: #C22C5D;
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(194, 44, 93, 0.3);
        }

        .error-msg {
            background: #FDE8EC;
            color: #C22C5D;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 12px;
            border-left: 4px solid #C22C5D;
            display: none;
            text-align: left;
        }

        .error-msg.show {
            display: block;
        }

        .success-msg {
            background: #E8F5E9;
            color: #2E7D32;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 12px;
            border-left: 4px solid #2E7D32;
            display: none;
            text-align: left;
        }

        .success-msg.show {
            display: block;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-primary.loading .btn-text {
            display: none;
        }

        .btn-primary.loading .spinner {
            display: block;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 22px 0 18px;
            color: #8D8494;
            font-size: 0.8rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #EFDDE4;
        }

        .text {
            text-align: center;
            margin-top: 4px;
            font-size: 0.9rem;
            color: #8D8494;
        }

        .text a {
            color: #E23F73;
            text-decoration: none;
            font-weight: 700;
        }

        .text a:hover {
            color: #C22C5D;
            text-decoration: underline;
        }

        .hidden-form {
            display: none;
        }

        .hidden-form.show {
            display: block;
        }

        @media (max-width: 480px) {
            .recover-box { padding: 32px 20px; width: 95%; }
            .recover-box h2 { font-size: 1.4rem; }
            .field input { padding: 12px 14px 12px 38px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="recover-box">
        <div class="brand">☕ CoffeeGuard</div>
        <h2>Forgot Password</h2>
        <p class="subtitle">Reset your password in seconds</p>

        {% if error %}
        <div class="error-msg show">⚠️ {{ error }}</div>
        {% endif %}

        {% if success %}
        <div class="success-msg show">✅ {{ success }}</div>
        {% endif %}

        <!-- Step 1: Enter Phone Number -->
        <form method="POST" action="/forgot-password" id="recoveryForm" class="recovery-step">
            <div class="field">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.574 2.81.7A2 2 0 0 1 22 16.92z"/>
                </svg>
                <input type="text" id="phoneInput" name="phone" placeholder="Enter your phone number" required>
            </div>

            <button type="submit" class="btn-primary" id="recoverBtn">
                <span class="btn-text">Find Account</span>
                <span class="spinner"></span>
            </button>
        </form>

        <!-- Step 2: Reset Password -->
        <form method="POST" action="/reset-password" id="resetForm" class="hidden-form recovery-step">
            <p style="color: #8D8494; text-align: left; margin-bottom: 16px; font-size: 0.9rem;">
                Account found! Enter your new password below.
            </p>
            
            <div class="field">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="4" y="11" width="16" height="9" rx="2"/>
                    <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                </svg>
                <input type="password" id="newPassword" name="new_password" placeholder="New Password" required minlength="6">
            </div>

            <div class="field">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="4" y="11" width="16" height="9" rx="2"/>
                    <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                </svg>
                <input type="password" id="confirmPassword" name="confirm_password" placeholder="Confirm Password" required minlength="6">
            </div>

            <input type="hidden" id="phoneHidden" name="phone" value="">

            <button type="submit" class="btn-primary" id="resetBtn">
                <span class="btn-text">Reset Password</span>
                <span class="spinner"></span>
            </button>
        </form>

        <div class="divider">or</div>

        <div class="text">
            Remember your password? <a href="/login">Login</a>
        </div>
    </div>

    <script>
        const recoveryForm = document.getElementById('recoveryForm');
        const resetForm = document.getElementById('resetForm');
        const phoneInput = document.getElementById('phoneInput');
        const phoneHidden = document.getElementById('phoneHidden');
        const errorMsg = document.querySelector('.error-msg');
        const successMsg = document.querySelector('.success-msg');

        // Step 1: Find account by phone
        recoveryForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const phone = phoneInput.value.trim();

            if (!phone) {
                errorMsg.textContent = '⚠️ Please enter your phone number.';
                errorMsg.classList.add('show');
                return;
            }

            const btn = document.getElementById('recoverBtn');
            btn.classList.add('loading');

            try {
                const response = await fetch('/find-account', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: phone })
                });

                const data = await response.json();

                if (response.ok && data.found) {
                    // Account found, show reset password form
                    phoneHidden.value = phone;
                    recoveryForm.classList.add('hidden-form');
                    resetForm.classList.add('show');
                    successMsg.textContent = `✅ Account found for ${data.email}!`;
                    successMsg.classList.add('show');
                    errorMsg.classList.remove('show');
                } else {
                    errorMsg.textContent = data.message || '⚠️ Account not found with this phone number.';
                    errorMsg.classList.add('show');
                }
            } catch (error) {
                errorMsg.textContent = '❌ Error: ' + error.message;
                errorMsg.classList.add('show');
            } finally {
                btn.classList.remove('loading');
            }
        });

        // Step 2: Reset password
        resetForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const phone = phoneHidden.value;
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;

            if (newPass !== confirmPass) {
                errorMsg.textContent = '⚠️ Passwords do not match!';
                errorMsg.classList.add('show');
                return;
            }

            if (newPass.length < 6) {
                errorMsg.textContent = '⚠️ Password must be at least 6 characters.';
                errorMsg.classList.add('show');
                return;
            }

            const btn = document.getElementById('resetBtn');
            btn.classList.add('loading');

            try {
                const response = await fetch('/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        phone: phone,
                        new_password: newPass 
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    errorMsg.classList.remove('show');
                    successMsg.textContent = '✅ Password reset successfully! Redirecting to login...';
                    successMsg.classList.add('show');
                    
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    errorMsg.textContent = data.message || '❌ Failed to reset password.';
                    errorMsg.classList.add('show');
                }
            } catch (error) {
                errorMsg.textContent = '❌ Error: ' + error.message;
                errorMsg.classList.add('show');
            } finally {
                btn.classList.remove('loading');
            }
        });
    </script>
</body>
</html>
